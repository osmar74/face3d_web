<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face3D Reconstruction{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <span class="logo-icon">⬡</span>
            <h1 class="app-title">Face3D <span class="accent">Reconstruction</span></h1>
            <span class="badge">Python · MediaPipe · OpenCV</span>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>Face3D Web · Visión Artificial &amp; Geometría Computacional</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
